name: Publish source and verify
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Bootstrap source publication'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import reviewed source with configured author and verify
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/source.bundle"
          git bundle verify "$RUNNER_TEMP/source.bundle"
          git fetch "$RUNNER_TEMP/source.bundle" refs/heads/main
          git cherry-pick --no-commit FETCH_HEAD
          # Workflow files are pre-created through the connected GitHub account.
          git -c user.name=NayGnehz -c user.email= commit --author='NayGnehz <>' -m 'Publish iOS Voice Engine with five standalone ARM64 voices'
          python tools/test.py --jdk "$JAVA_HOME" --work "$RUNNER_TEMP/ios-voice-engine-tests"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python -m compileall -q tools
          git push origin HEAD:main
