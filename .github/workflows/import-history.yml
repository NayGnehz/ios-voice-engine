name: Publish reconstructed history
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  history:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publish reconstructed version history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import verified version commits and merge without replacing release code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "eae11d620b9fa770c2b0842750eafb818c7ebce3"
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/history.bundle"
          git bundle verify "$RUNNER_TEMP/history.bundle"
          git fetch "$RUNNER_TEMP/history.bundle" "refs/heads/history/reconstructed-20261114:refs/heads/history/reconstructed-20261114" "refs/heads/main:refs/history-import/docs" "refs/tags/reconstructed/*:refs/tags/reconstructed/*"
          test "$(git rev-parse history/reconstructed-20261114)" = "35944e2ed9492d76e9cb40e975dbf63bfe724017"
          test "$(git rev-parse refs/history-import/docs)" = "ed913f328cd314336b11f11850a5f66670e28853"
          test "$(git rev-parse 'refs/tags/v1.5.0^{}')" = "eae11d620b9fa770c2b0842750eafb818c7ebce3"
          git -c user.name=NayGnehz -c user.email= merge --no-ff --no-commit -s ours history/reconstructed-20261114
          git restore --source=refs/history-import/docs -- README.md docs/HISTORY.md docs/history-index.json tools/reconstruct_history.py
          git add -- README.md docs/HISTORY.md docs/history-index.json tools/reconstruct_history.py
          git -c user.name=NayGnehz -c user.email= commit --author='NayGnehz <>' -m 'Merge retrospectively reconstructed version history without changing release engine'
          git diff --exit-code eae11d620b9fa770c2b0842750eafb818c7ebce3 HEAD -- src tests eng voices.json tools/build.py tools/test.py tools/verify_release.py tools/patch_marks.py tools/patch_fd_close.py tools/elf_view.py
          python tools/test.py --jdk "$JAVA_HOME" --work "$RUNNER_TEMP/history-checks"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python -m compileall -q tools
          git push --atomic origin HEAD:refs/heads/main refs/heads/history/reconstructed-20261114:refs/heads/history/reconstructed-20261114 "refs/tags/reconstructed/*:refs/tags/reconstructed/*"
