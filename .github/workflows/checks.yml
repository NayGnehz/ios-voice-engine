name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run rate, range and readiness regressions
        run: python tools/test.py --jdk "$JAVA_HOME" --work "$RUNNER_TEMP/ios-voice-engine-tests"
      - name: Check Python source syntax
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python -m compileall -q tools
